<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Herzlichen Glückwunsch zu deinem gefundenen Geschenk."
    />
    <title>Herzlichen Glückwunsch!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page page-gift">
    <main class="card gift-card" aria-labelledby="gift-title">
      <div class="balloon balloon-one" aria-hidden="true"><span></span></div>
      <div class="balloon balloon-two" aria-hidden="true"><span></span></div>
      <div class="balloon balloon-three" aria-hidden="true"><span></span></div>

      <p class="eyebrow">Etappe geschafft</p>
      <h1 id="gift-title">Herzlichen Glückwunsch!</h1>
      <p class="intro">Dein Geschenk ist:</p>

      <div class="gift-image-wrap">
        <img id="gift-image" src="Geschenk.jpg" alt="Dein Geschenk" />
        <div id="image-placeholder" class="image-placeholder" hidden>
          <span>Geschenkfoto folgt hier</span>
        </div>
      </div>
    </main>

    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <script src="script.js"></script>
  </body>
</html>
